services:
  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    container_name: carrental-api
    ports:
      - "8080:8080"
    environment:
      # Development: no Azure Key Vault nor Application Insights, and Swagger enabled.
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network the database is reached by its service name, not by localhost.
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__MongoDbDatabaseName: carrental
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    container_name: carrental-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
